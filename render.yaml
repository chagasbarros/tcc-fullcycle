# Render Blueprint (ADR-0018). Free plan: Render allows ONE free Postgres and ONE free
# Key Value per workspace, so staging and production share them, isolated:
#   Postgres:  database marketplace_production (created here) and marketplace_staging
#              (created once by hand, see docs/deploy.md)
#   Key Value: logical database 0 = production, 1 = staging (index at the end of REDIS_URL)
# Deploys come from GitHub Actions (.github/workflows/deploy.yml) through each service's
# deploy hook: staging after green CI on main, production after manual approval.

databases:
  - name: marketplace-db
    plan: free
    region: virginia
    postgresMajorVersion: '16'
    databaseName: marketplace_production
    user: marketplace
    # Open so the staging database can be created with psql from outside (docs/deploy.md).
    # Protected by password + TLS; can be emptied after that setup.
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: keyvalue
    name: marketplace-redis
    plan: free
    region: virginia
    # BullMQ requires noeviction: an evicted job would be a lost order payment. When memory
    # is full, cache writes fail instead, and the cache falls back to the database (ADR-0014).
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections only

  - type: web
    name: marketplace-api-production
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start-with-migrations.sh
    healthCheckPath: /health
    autoDeployTrigger: 'off' # deploys come from GitHub Actions (deploy hook)
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: marketplace-common
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketplace-redis
          property: connectionString

  - type: web
    name: marketplace-api-staging
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start-with-migrations.sh
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: staging
      - fromGroup: marketplace-common
      # Same instances as production, other database / logical db: asked once at creation.
      # DATABASE_URL = production's Internal URL with /marketplace_staging at the end
      # REDIS_URL    = Key Value's Internal URL with /1 at the end
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

envVarGroups:
  - name: marketplace-common
    envVars:
      - key: LOG_LEVEL
        value: info
      # No background workers on the free plan: consumers run inside the API process.
      - key: RUN_WORKER_IN_PROCESS
        value: 'true'
      # Kill switch of the catalog cache (ADR-0015): no Unleash on Render, change it here.
      - key: CATALOG_CACHE_ENABLED
        value: 'true'
      - key: PAYMENT_PROVIDER_LATENCY_MS
        value: '0'
