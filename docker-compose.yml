# Local environment: `docker compose up -d` starts everything.
# Credentials below are for local development only (never used in staging/production).
# Observability: Grafana http://localhost:3001 · Prometheus http://localhost:9090 · Jaeger http://localhost:16686
# Feature flags: Unleash http://localhost:4242 (admin / unleash4all, local only)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies pending migrations, then exits.
  migrate:
    build:
      context: .
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: marketplace-api
      # Feature flags from the local Unleash (ADR-0015). Local-only token, see the unleash service.
      UNLEASH_URL: http://unleash:4242/api
      UNLEASH_API_TOKEN: default:development.local-dev-client-token
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Queue consumers (ADR-0010): same image as the api, different command, no HTTP.
  worker:
    build:
      context: .
      target: runtime
    command: ['node', '--import', './dist/instrumentation.js', 'dist/worker.js']
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      REDIS_URL: redis://redis:6379
      PAYMENT_PROVIDER_LATENCY_MS: 0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: marketplace-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Unleash's own database: flag data stays apart from business data (seed, TRUNCATEs).
  # No volume: flags are recreated by unleash-setup on every `up`.
  unleash-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
      POSTGRES_DB: unleash
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unleash -d unleash']
      interval: 5s
      timeout: 3s
      retries: 10

  # Feature flags (ADR-0015).
  # The tokens below are fixed, LOCAL-ONLY values (like the database password above);
  # on Render there is no Unleash: the flag comes from an env var.
  unleash:
    image: unleashorg/unleash-server:7.1.0
    environment:
      DATABASE_URL: postgres://unleash:unleash@unleash-db:5432/unleash
      DATABASE_SSL: 'false'
      INIT_CLIENT_API_TOKENS: default:development.local-dev-client-token
      INIT_ADMIN_API_TOKENS: '*:*.local-dev-admin-token'
    ports:
      - '4242:4242'
    depends_on:
      unleash-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4242/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # One-shot: creates the catalog-cache-enabled flag (ON) if it does not exist yet.
  unleash-setup:
    image: curlimages/curl:8.15.0
    entrypoint: ['sh', '/setup.sh']
    environment:
      UNLEASH_ADMIN_URL: http://unleash:4242
      UNLEASH_ADMIN_TOKEN: '*:*.local-dev-admin-token'
    volumes:
      - ./ops/unleash/setup.sh:/setup.sh:ro
    depends_on:
      unleash:
        condition: service_healthy

  # Traces: the API and the worker send spans over OTLP/HTTP (src/instrumentation.ts).
  # In-memory storage: traces are lost on restart (fine for local use and the demo).
  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP/HTTP, also used by `npm run dev` with OTEL_EXPORTER_OTLP_ENDPOINT

  # Scrapes /metrics of the API every 5 s (ops/prometheus/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 5

  # Datasource and RED dashboard are provisioned from ops/grafana (nothing to click).
  # Anonymous read-only access, local use only.
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/marketplace-red.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
