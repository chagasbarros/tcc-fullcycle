name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

env:
  # prisma.config.ts needs DATABASE_URL to load, but `prisma generate` never connects.
  # Placeholder only: no real credentials live in the pipeline.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

# Third-party actions are pinned by commit SHA (tags can be moved); the tag is in the comment.
jobs:
  # Fast feedback first: static checks, OpenAPI lint and unit tests with the coverage gate.
  quality:
    name: Lint, typecheck, unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run openapi:lint
      # Runs the unit tests and fails if coverage drops below the thresholds in vitest.config.ts.
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      # Docker is preinstalled on ubuntu-latest; Testcontainers starts PostgreSQL and Redis.
      - run: npm run test:integration

  contract:
    name: Contract tests (Pact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:contract

  security:
    name: Security (npm audit, Trivy, gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not only the last commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # SCA of the npm dependencies: fails on high or critical advisories.
      - name: npm audit
        run: npm audit --audit-level=high

      # Scans the image that would be deployed: base OS packages + production dependencies.
      - name: Build runtime image
        run: docker build --target runtime --tag marketplace-api:${{ github.sha }} .
      - name: Trivy (container image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: marketplace-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          # Only fail on vulnerabilities that already have a fix we can apply.
          ignore-unfixed: true
          exit-code: '1'

      # Secret scanning over the git history. No license needed for a personal account.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
