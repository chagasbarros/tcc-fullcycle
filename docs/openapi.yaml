openapi: 3.1.0
info:
  title: Marketplace API
  version: 0.1.0
  summary: Monólito modular — catálogo, pedidos e pagamentos (TCC Fullcycle, Projeto A).
  description: |
    Contrato da API do marketplace. Arquivo único com catálogo e pedidos.

    - Dinheiro sempre em centavos (inteiro), nunca float.
    - IDs são UUID v7.
    - Erros seguem a RFC 9457 (`application/problem+json`).
  contact:
    name: Chagas Barros
servers:
  - url: http://localhost:3000
    description: Local (docker compose)
tags:
  - name: health
    description: Verificação de saúde
  - name: observability
    description: Métricas para o Prometheus
  - name: catalog
    description: Produtos, preço e estoque
  - name: orders
    description: Pedidos e seus estados (ADR-0007)

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Verifica se a API está no ar
      description: Usado pelo healthcheck do Docker Compose e do Render.
      responses:
        '200':
          description: API saudável
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /metrics:
    get:
      tags: [observability]
      operationId: getMetrics
      summary: Métricas RED no formato do Prometheus
      description: >-
        Histograma http_request_duration_seconds por método, rota (template, não a URL)
        e status, mais as métricas padrão do Node.js. Lido pelo Prometheus.
      responses:
        '200':
          description: Métricas no formato de exposição de texto do Prometheus
          content:
            text/plain:
              schema:
                type: string

  /catalog/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Lista produtos com paginação
      description: Lista paginada (offset), ordenada por ID. Retorna também o total de produtos.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Cria um produto
      description: Preço em centavos (inteiro). Responde 201 com o header `Location` do novo produto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
      responses:
        '201':
          description: Produto criado
          headers:
            Location:
              description: URL do produto criado
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /catalog/products/{id}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Busca um produto pelo ID
      description: Retorna o produto com preço e estoque atuais.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    post:
      tags: [orders]
      operationId: placeOrder
      summary: Cria um pedido
      description: |
        Copia nome e preço atuais dos produtos (snapshot) e reserva o estoque de forma
        atômica e tudo-ou-nada (ADR-0009). O pedido nasce em `PENDING_PAYMENT` e o
        pagamento é processado de forma assíncrona. Produtos repetidos são somados.

        **Idempotência (ADR-0016):** com o header `Idempotency-Key`, repetir a mesma
        requisição devolve o pedido criado na primeira vez (`201` com
        `Idempotent-Replayed: true`), sem reservar estoque nem criar outro pedido. A chave
        vale por cliente. Enquanto a primeira requisição com a chave ainda está em
        andamento, as outras recebem `409` com `Retry-After`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrder'
      responses:
        '201':
          description: Pedido criado, aguardando pagamento (ou devolvido, se for uma repetição)
          headers:
            Location:
              description: URL do pedido criado
              schema: { type: string }
            Idempotent-Replayed:
              description: >-
                Presente (`true`) quando o pedido já existia para esta Idempotency-Key: nada novo
                foi criado. O corpo traz o pedido com o status atual.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >-
            Sem estoque suficiente, ou outra requisição com a mesma Idempotency-Key ainda está em
            andamento (neste caso com `Retry-After`; repetir depois devolve o pedido).
          headers:
            Retry-After:
              description: Segundos para tentar de novo (só quando a chave está em uso)
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >-
            Produto inexistente, pedido inválido, ou Idempotency-Key já usada por este cliente para
            um pedido diferente.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Busca um pedido pelo ID
      description: Retorna o pedido com o status atual. Como o pagamento é assíncrono, consulte este endpoint para acompanhar `PENDING_PAYMENT` → `PAID` / `PAYMENT_FAILED`.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancela um pedido que ainda aguarda pagamento
      description: Devolve o estoque reservado. Só é possível a partir de `PENDING_PAYMENT`.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Chave escolhida pelo cliente (ex.: um UUID gerado ao abrir o checkout) para que
        retentativas não criem pedidos duplicados. De 1 a 255 caracteres ASCII visíveis.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Product:
      type: object
      required: [id, name, priceInCents, stock]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        priceInCents:
          type: integer
          minimum: 0
          description: Preço em centavos (ex. 34990 = R$ 349,90)
        stock: { type: integer, minimum: 0 }

    CreateProduct:
      type: object
      required: [name, priceInCents, stock]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        priceInCents: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }

    ProductPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    PlaceOrder:
      type: object
      required: [customerId, paymentMethod, items]
      properties:
        customerId:
          type: string
          format: uuid
          description: Identidade externa do cliente (ADR-0008)
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 1000 }

    PaymentMethod:
      type: string
      enum: [CARD, PIX]
      description: |
        Meio de pagamento (ADR-0011). O pagamento é processado de forma assíncrona;
        consulte `GET /orders/{id}` para ver o resultado.
        Simulação: cartão recusa valores que terminam em 13 centavos; Pix sempre aprova.

    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAID, PAYMENT_FAILED, CANCELLED]
      description: |
        `PENDING_PAYMENT` pode ir para `PAID`, `PAYMENT_FAILED` ou `CANCELLED`;
        os demais são estados finais (ADR-0007).

    Order:
      type: object
      required: [id, customerId, status, paymentMethod, totalInCents, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        totalInCents: { type: integer, minimum: 0, description: Total em centavos }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [productId, productName, unitPriceInCents, quantity, subtotalInCents]
            properties:
              productId: { type: string, format: uuid }
              productName:
                type: string
                description: Nome no momento da compra (snapshot)
              unitPriceInCents:
                type: integer
                minimum: 0
                description: Preço no momento da compra (snapshot)
              quantity: { type: integer, minimum: 1 }
              subtotalInCents: { type: integer, minimum: 0 }

    Problem:
      description: RFC 9457 Problem Details
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          description: Campos inválidos (apenas em 400)
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito com o estado atual (sem estoque ou transição de estado inválida)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableContent:
      description: Regra de negócio violada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
